<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Minecraft 26.3</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center}
main{width:min(520px,calc(100% - 40px));text-align:center}
h1{font-size:22px;margin:0 0 12px}
p{font-size:14px;line-height:1.45;color:#aaa;margin:0 0 16px}
progress{width:100%;height:10px}
#status{margin-top:12px;font-size:13px;color:#888}
button{margin-top:18px;background:#fff;color:#000;border:0;border-radius:8px;padding:10px 14px;font-weight:700;display:none}
</style>
</head>
<body>
<main>
<h1>Minecraft 26.3</h1>
<p>Preparing the iPad-compatible browser build.</p>
<progress id="bar"></progress>
<div id="status">Starting loader…</div>
<button id="retry">Retry</button>
</main>
<script>
(async()=>{
  const status=document.getElementById("status");
  const retry=document.getElementById("retry");
  try{
    if(!("serviceWorker" in navigator)) throw new Error("Service workers are not supported in this browser");
    status.textContent="Installing streaming loader…";
    const reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
    await navigator.serviceWorker.ready;
    if(reg.waiting) reg.waiting.postMessage({type:"SKIP_WAITING"});
    status.textContent="Opening Minecraft 26.3…";
    location.replace("./game.html");
  }catch(error){
    console.error(error);
    status.textContent="Load failed: "+(error?.message||String(error));
    retry.style.display="inline-block";
    retry.onclick=()=>location.reload();
  }
})();
</script>
</body>
</html>
