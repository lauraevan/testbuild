name: publish-minecraft-26-3-githack

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-minecraft-26-3-githack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-minecraft-26-3-githack
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_URL: https://github.com/TypeThe0ry/Gaius/releases/download/v0.3.3/Gaius-26.3.html
      RELEASE_SHA256: 0c1ab5fc49c244bac0f16ef000a9f4f36fa3414180f02a6775c4977c672c97d3
      RELEASE_SIZE: "129069152"
      CHUNK_BYTES: "4194304"

    steps:
      - uses: actions/checkout@v4

      - name: Download and verify Minecraft 26.3 browser build
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/minecraft-26.3"
          mkdir -p "$work"
          curl -fL --retry 5 --retry-delay 2 -o "$work/source.html" "$RELEASE_URL"
          test "$(sha256sum "$work/source.html" | awk '{print $1}')" = "$RELEASE_SHA256"
          test "$(wc -c < "$work/source.html" | tr -d ' ')" = "$RELEASE_SIZE"

      - name: Apply deploy identity without repacking
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/minecraft-26.3"
          python3 - "$work/source.html" "$work/game.html" <<'PY'
          import pathlib,re,sys
          source=pathlib.Path(sys.argv[1])
          output=pathlib.Path(sys.argv[2])
          text=source.read_text(encoding="utf-8")
          titles=re.findall(r"<title>[^<]*Gaius[^<]*</title>",text,flags=re.I)
          if len(titles)!=1:
              raise SystemExit(f"expected one Gaius title, found {len(titles)}")
          text=text.replace(titles[0],"<title>Minecraft 26.3</title>",1)
          for old,new in [
              (">GAIUS<span>CLIENT</span>",">MINECRAFT<span>26.3</span>"),
              ("<strong>GAIUS</strong><span>CLIENT</span>","<strong>MINECRAFT</strong><span>26.3</span>"),
              ("Starting Gaius Client","Starting Minecraft 26.3"),
              ("<strong>Gaius Client</strong> | independent browser software",""),
              ("BROWSER CLIENT",""),
          ]:
              text=text.replace(old,new)

          shell_override = r"""
          <style id="minecraft263-boot-override">
            :root {
              --gaius-shell-bg: #000 !important;
              --gaius-shell-panel: #000 !important;
              --gaius-shell-panel-strong: #000 !important;
              --gaius-shell-line: #fff !important;
              --gaius-shell-muted: #9a9a9a !important;
              --gaius-shell-text: #fff !important;
              --gaius-shell-accent: #fff !important;
              --gaius-shell-accent-strong: #fff !important;
            }

            html, body, #mc-canvas, #boot-screen {
              background: #000 !important;
            }

            #boot-screen::before,
            #gaius-shell-header,
            #gaius-shell-footer,
            #perf-hud,
            #boot-progress-text {
              display: none !important;
            }

            #boot-brand {
              top: 46% !important;
              color: #fff !important;
              font: 900 clamp(42px, 10vw, 86px)/0.82 Arial, Helvetica, sans-serif !important;
              letter-spacing: -0.045em !important;
              text-shadow: none !important;
              animation: none !important;
            }

            #boot-brand span {
              margin-top: 16px !important;
              color: #fff !important;
              font-size: 0.17em !important;
              font-weight: 700 !important;
              letter-spacing: 0.22em !important;
            }

            #boot-progress {
              top: 60% !important;
              width: min(420px, calc(100vw - 56px)) !important;
              height: 8px !important;
              padding: 1px !important;
              border: 1px solid rgba(255,255,255,.9) !important;
              background: transparent !important;
            }

            #boot-progress-bar {
              background: #fff !important;
              transition: width 120ms linear !important;
            }

            #status:not([data-state="error"]) {
              display: none !important;
            }

            #status[data-state="error"] {
              top: 66% !important;
              max-width: 680px !important;
              border: 1px solid #fff !important;
              background: rgba(0,0,0,.94) !important;
              color: #fff !important;
            }

            @media (max-width: 600px) {
              #boot-brand {
                top: 44% !important;
                font-size: 48px !important;
              }
              #boot-progress {
                top: 58% !important;
              }
            }
          </style>
          """

          if "</head>" not in text:
              raise SystemExit("launcher is missing </head>")
          text=text.replace("</head>",shell_override+"\n</head>",1)

          # Visible launcher identity must be Minecraft-only. Internal runtime
          # symbol names are intentionally left untouched for compatibility.
          if ">GAIUS<span>CLIENT</span>" in text:
              raise SystemExit("old boot brand survived deploy rewrite")
          if "<strong>GAIUS</strong><span>CLIENT</span>" in text:
              raise SystemExit("old shell brand survived deploy rewrite")
          if "minecraft263-boot-override" not in text:
              raise SystemExit("Minecraft boot override was not injected")

          output.write_text(text,encoding="utf-8")
          PY

      - name: Split into GitHack-friendly same-origin chunks
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/minecraft-26.3"
          chunks="$root/chunks"
          work="$RUNNER_TEMP/minecraft-26.3"
          rm -rf "$chunks"
          mkdir -p "$chunks"

          split -b "$CHUNK_BYTES" -d -a 3 "$work/game.html" "$chunks/chunk-"

          python3 - "$root" "$work/game.html" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          game=pathlib.Path(sys.argv[2])
          files=sorted((root/"chunks").glob("chunk-*"))
          if not files:
              raise SystemExit("no chunks generated")
          manifest={
              "minecraftVersion":"26.3",
              "protocolVersion":777,
              "source":"Gaius v0.3.3 pinned browser release",
              "sourceSha256":"0c1ab5fc49c244bac0f16ef000a9f4f36fa3414180f02a6775c4977c672c97d3",
              "gameSha256":hashlib.sha256(game.read_bytes()).hexdigest(),
              "totalBytes":game.stat().st_size,
              "chunkBytes":4194304,
              "chunks":["chunks/"+p.name for p in files],
          }
          (root/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(manifest,indent=2))
          PY

      - name: Commit generated deploy chunks
        run: |
          set -euo pipefail
          git config user.name "minecraft-26.3-deploy"
          git config user.email "actions@users.noreply.github.com"
          git add minecraft-26.3/chunks minecraft-26.3/manifest.json
          if git diff --cached --quiet; then
            echo "Deploy chunks already current"
            exit 0
          fi
          git commit -m "Publish streamed Minecraft 26.3 GitHack build"
          git push origin HEAD:main
