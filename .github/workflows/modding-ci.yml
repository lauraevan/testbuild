name: modding-ci

on:
  push:
    branches: [forge-fabric-web]
  pull_request:
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/modding-ci.yml"

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile helper and self-test
        run: |
          mkdir -p build/test
          javac --release 17 -d build/test $(find src/main/java src/test/java -name '*.java' -print)
          java -cp build/test dev.testbuild.HybridBuilderSelfTest
