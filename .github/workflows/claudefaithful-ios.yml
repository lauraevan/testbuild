name: ClaudeFaithful v0.8 iOS 26 Liquid Glass build
on:
  push:
    branches: [claudefaithful-ios-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack SwiftUI project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ClaudeFaithful-build"
          unzip -o -q "$GITHUB_WORKSPACE/build_inputs/ClaudeFaithful-source.zip" -d "$GITHUB_WORKSPACE/ClaudeFaithful-build"
      - name: Select Xcode 26 and inspect SDK
        run: |
          ls /Applications | grep Xcode || true
          XCODE26=$(find /Applications -maxdepth 1 -type d -iname 'Xcode_26*.app' | sort -V | tail -1)
          if [ -n "$XCODE26" ]; then sudo xcode-select -s "$XCODE26/Contents/Developer"; fi
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK=$SDK"
          case "$SDK" in 26.*|27.*) ;; *) echo "Requires iOS 26+ SDK to render native Liquid Glass"; exit 1;; esac
      - name: Source checks
        run: |
          python3 -m unittest discover -s tests -v
          swiftc -frontend -parse Sources/*.swift
        working-directory: ClaudeFaithful-build
      - name: Compile and package unsigned IPA
        run: bash tools/build_unsigned_ipa.sh
        working-directory: ClaudeFaithful-build
      - name: Verify compiled archive
        run: |
          test -s ClaudeFaithful-build/dist/ClaudeFaithful-unsigned.ipa
          unzip -t ClaudeFaithful-build/dist/ClaudeFaithful-unsigned.ipa | tail -3
          unzip -l ClaudeFaithful-build/dist/ClaudeFaithful-unsigned.ipa | grep 'Payload/ClaudeFaithful.app/ClaudeFaithful$'
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFaithful-v0.8-unsigned-IPA
          path: ClaudeFaithful-build/dist/ClaudeFaithful-unsigned.ipa
          if-no-files-found: error
      - name: Run iOS 26 simulator screenshots
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ClaudeFaithful-build
        run: |
          xcodebuild -project ClaudeFaithful.xcodeproj -scheme ClaudeFaithful -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build-sim" CODE_SIGNING_ALLOWED=NO build > /tmp/claude-simulator.log 2>&1 || {
              tail -130 /tmp/claude-simulator.log
              exit 1
            }
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; ds=[x["udid"] for r,v in d.items() if "iOS-26" in r or "iOS-27" in r for x in v if "iPhone" in x["name"] and x["state"]=="Shutdown"]; print(ds[0] if ds else "")')
          if [ -z "$UDID" ]; then echo 'No iOS 26+ iPhone simulator available'; exit 0; fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark || true
          xcrun simctl status_bar "$UDID" override --time '7:45' --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 90 || true
          xcrun simctl install "$UDID" "$PWD/build-sim/Build/Products/Debug-iphonesimulator/ClaudeFaithful.app"
          xcrun simctl launch "$UDID" dev.bullet.claudefrontend
          sleep 7
          mkdir -p dist
          xcrun simctl io "$UDID" screenshot "$PWD/dist/ClaudeFaithful-v0.8-home.png"
          xcrun simctl terminate "$UDID" dev.bullet.claudefrontend
          xcrun simctl launch "$UDID" dev.bullet.claudefrontend --settings-snapshot
          sleep 7
          xcrun simctl io "$UDID" screenshot "$PWD/dist/ClaudeFaithful-v0.8-settings.png"
          xcrun simctl terminate "$UDID" dev.bullet.claudefrontend
          xcrun simctl launch "$UDID" dev.bullet.claudefrontend --chat-snapshot
          sleep 6
          xcrun simctl io "$UDID" screenshot "$PWD/dist/ClaudeFaithful-v0.8-chat.png"
          xcrun simctl shutdown "$UDID"
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFaithful-v0.8-screenshots
          path: ClaudeFaithful-build/dist/ClaudeFaithful-v0.8-*.png
          if-no-files-found: ignore