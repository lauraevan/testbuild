name: Populate 26.3 asset-swap test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/populate-hybrid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned mcjs payloads
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/Enchantment-Niko/mcjs/bc586558628e2d7ef8ea1cebf198495625619eb2"

          curl -fL "$base/wasm-loader/26.2/index.html" -o index.html
          curl -fL "$base/wasm-loader/26.2/eag26.2-decoder.wasm" -o eag26.2-decoder.wasm
          curl -fL "$base/wasm-loader/26.2/eag26.2-wasm-br.wasm" -o eag26.2-wasm-br.wasm
          curl -fL "$base/wasm-loader/26.2/eag26.2-mesh-wasm-br.wasm" -o eag26.2-mesh-wasm-br.wasm
          curl -fL "$base/wasm-loader/26.2/eag26.2-server-wasm-br.wasm" -o eag26.2-server-wasm-br.wasm
          curl -fL "$base/wasm-loader/26.2/eag26.2-sounds.epk" -o eag26.2-sounds.epk

          # Intentional hybrid: 26.3 asset bytes under the filename expected by the 26.2 loader.
          curl -fL "$base/wasm-loader/26.3/eag26.3-assets.epk" -o eag26.2-assets.epk

      - name: Sanity-check downloads
        shell: bash
        run: |
          set -euo pipefail
          for f in             index.html             eag26.2-decoder.wasm             eag26.2-wasm-br.wasm             eag26.2-mesh-wasm-br.wasm             eag26.2-server-wasm-br.wasm             eag26.2-sounds.epk             eag26.2-assets.epk
          do
            test -s "$f"
            printf '%-40s %12s bytes\n' "$f" "$(wc -c < "$f")"
          done
          sha256sum eag26.2-*

      - name: Commit populated hybrid
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html eag26.2-*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Populate 26.2 runtime with 26.3 assets"
          git push
